# The sandbox containers the deep agent's subagents run their commands in. SandboxPoolDocker
# brings this project up when the server starts and down when it stops; every service is one
# pool slot. Containers sit idle on `sleep infinity` and are entered with `docker exec`.
#
# The network gives each container a fixed address and nothing else to reach. It is internal,
# so there is no route out of it. Its gateway is isolated, so the host has no address on it:
# an internal network otherwise still reaches every service the host listens on. Traffic
# between containers is switched off, so one user's code cannot talk to the container
# running another user's.

name: vela47-sandbox

x-sandbox: &sandbox
  build: .
  image: vela47-sandbox
  command: ["sleep", "infinity"]
  mem_limit: 512m
  cpus: 1.0
  pids_limit: 256

services:
  slot-0:
    <<: *sandbox
    container_name: vela47-slot-0
    networks:
      sandbox:
        ipv4_address: 172.30.47.10
  slot-1:
    <<: *sandbox
    container_name: vela47-slot-1
    networks:
      sandbox:
        ipv4_address: 172.30.47.11
  slot-2:
    <<: *sandbox
    container_name: vela47-slot-2
    networks:
      sandbox:
        ipv4_address: 172.30.47.12
  slot-3:
    <<: *sandbox
    container_name: vela47-slot-3
    networks:
      sandbox:
        ipv4_address: 172.30.47.13
  slot-4:
    <<: *sandbox
    container_name: vela47-slot-4
    networks:
      sandbox:
        ipv4_address: 172.30.47.14
  slot-5:
    <<: *sandbox
    container_name: vela47-slot-5
    networks:
      sandbox:
        ipv4_address: 172.30.47.15
  slot-6:
    <<: *sandbox
    container_name: vela47-slot-6
    networks:
      sandbox:
        ipv4_address: 172.30.47.16
  slot-7:
    <<: *sandbox
    container_name: vela47-slot-7
    networks:
      sandbox:
        ipv4_address: 172.30.47.17
  slot-8:
    <<: *sandbox
    container_name: vela47-slot-8
    networks:
      sandbox:
        ipv4_address: 172.30.47.18
  slot-9:
    <<: *sandbox
    container_name: vela47-slot-9
    networks:
      sandbox:
        ipv4_address: 172.30.47.19

networks:
  sandbox:
    internal: true
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    ipam:
      config:
        - subnet: 172.30.47.0/24
