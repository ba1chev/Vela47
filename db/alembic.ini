# Alembic CLI settings, only for writing a new revision against the local SQLite file:
#   alembic -c db/alembic.ini revision --autogenerate --rev-id 0002 -m "add something"
# The server never reads this file; DatabaseMigrator runs the revisions itself on start.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/..
sqlalchemy.url = sqlite:///%(here)s/vela47.sqlite3
