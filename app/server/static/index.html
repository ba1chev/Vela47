<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Vela47</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="particles-js" aria-hidden="true"></div>

  <div class="app">
    <main class="chat">
      <header class="chat-head">
        <span class="brand-dot" aria-hidden="true"></span>
        <h1>Vela47</h1>
        <span class="status" id="status" data-state="idle">idle</span>
      </header>

      <div class="messages" id="messages">
        <div class="empty" id="empty">
          <div class="orb" aria-hidden="true"><span></span><span></span><span></span></div>
          <p>Ask something that needs more than one step.</p>
          <p class="hint">The pipeline plans it, splits it into tasks, runs a subagent per task, then merges the results.</p>
        </div>
      </div>

      <form class="composer" id="composer">
        <textarea id="input" rows="1" placeholder="Ask anything…" autocomplete="off"></textarea>
        <button type="submit" id="send" aria-label="Send">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M4 12h15M13 6l6 6-6 6" fill="none" stroke="currentColor"
                  stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </form>
    </main>

    <aside class="trace">
      <header class="trace-head">
        <h2>Trace</h2>
        <button type="button" id="clear" class="ghost">clear</button>
      </header>
      <div class="trace-body">
        <ol class="events" id="events"></ol>
        <div class="trace-empty" id="trace-empty">Nothing yet.</div>
      </div>
    </aside>
  </div>

  <script src="/static/vendor/particles.min.js"></script>
  <script src="/static/background.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
